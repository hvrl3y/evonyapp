plugins {
    id 'com.android.application'
}

android {
    namespace 'com.harley.marchhelper'
    compileSdk 34

    defaultConfig {
        applicationId 'com.harley.marchhelper'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '0.2'
    }

    // Fixed key so every new build installs over the previous one.
    signingConfigs {
        shared {
            storeFile file('marchitect-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // On-device text recognition (bundled model, works offline, no cost).
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
