<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Marchitect Overlay</title>
<style>
  :root{
    --bg:#000; --card:#1C1C1E; --card2:#2C2C2E; --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.18);
    --text:#fff; --dim:rgba(235,235,245,.6); --dim3:rgba(235,235,245,.3); --line:rgba(84,84,88,.65);
    --tint:#F2B544; --tint-dim:rgba(242,181,68,.18); --red:#FF453A; --green:#30D158;
    --ground:#C8A27A; --ranged:#30D158; --mounted:#FF6961; --siege:#9EA3AD;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font:13.5px/1.25 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;letter-spacing:-.15px;-webkit-user-select:none;user-select:none}
  input{-webkit-user-select:text;user-select:text}
  #app{padding:6px 7px 7px}
  .hide{display:none!important}
  .ic{width:18px;height:18px;object-fit:contain;flex:none}
  .num{font-variant-numeric:tabular-nums}
  .c-ground{color:var(--ground)} .c-ranged{color:var(--ranged)} .c-mounted{color:var(--mounted)} .c-siege{color:var(--siege)}
  .b-ground{background:var(--ground)} .b-ranged{background:var(--ranged)} .b-mounted{background:var(--mounted)} .b-siege{background:var(--siege)}

  .seg{display:flex;background:var(--fill);border-radius:7px;padding:2px}
  .seg button{flex:1;display:flex;align-items:center;justify-content:center;background:none;border:0;color:var(--text);
    font:500 11.5px/1 -apple-system,system-ui,Roboto,sans-serif;padding:3px 1px;border-radius:5px;position:relative;min-height:24px}
  .seg button+button::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:.5px;background:rgba(142,142,147,.4)}
  .seg button.on{background:#636366;font-weight:600}
  .seg button.on::before,.seg button.on+button::before{display:none}
  .seg .ic{width:17px;height:17px}

  .card{background:var(--card);border-radius:8px;overflow:hidden}
  .empty{color:var(--dim);font-size:12px;padding:8px;text-align:center;line-height:16px}
  h3{margin:10px 0 4px 6px;font-size:10.5px;font-weight:400;text-transform:uppercase;color:var(--dim)}
  .note{color:var(--dim);font-size:11px;line-height:14px;margin:5px 6px 0}

  /* ---------- LAYERS ---------- */
  .ms{display:flex;align-items:center;gap:6px;margin-bottom:5px}
  .ms .ic{width:20px;height:20px}
  .ms input{flex:1;min-width:0;background:none;border:0;color:var(--text);padding:0;
    font:700 18px/1.15 -apple-system,system-ui,Roboto,sans-serif;font-variant-numeric:tabular-nums}
  .ms input:focus{outline:none;color:var(--tint)}
  .ms input.flash{animation:fl .7s}
  @keyframes fl{0%{color:var(--green)}100%{color:var(--text)}}
  .st{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--dim);text-transform:uppercase;flex:none}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--dim3)}
  .dot.on{background:var(--green);box-shadow:0 0 5px var(--green)}
  .enable{background:var(--tint-dim);color:var(--tint);border:0;border-radius:99px;font:600 10.5px/1 system-ui;padding:5px 7px}
  .ctl{display:flex;gap:4px;align-items:center;margin-bottom:5px}
  .ctl .seg{flex:1}
  .step{display:flex;align-items:center;background:var(--fill);border-radius:7px;height:28px;flex:none}
  .step button{width:22px;height:100%;background:none;border:0;color:var(--tint);font:600 16px/1 system-ui}
  .step span{min-width:26px;text-align:center;font:600 12.5px/1 -apple-system,system-ui,Roboto,sans-serif}
  .lr{display:flex;align-items:center;gap:6px;padding:4px 7px;position:relative;font-variant-numeric:tabular-nums}
  .lr+.lr::before{content:"";position:absolute;top:0;left:7px;right:0;height:.5px;background:var(--line)}
  .lr .t{width:28px;font-weight:600;color:var(--tint)}
  .lr .n{flex:1;text-align:right;font-weight:600;font-size:14px}
  .lr .p{width:30px;text-align:right;color:var(--dim);font-size:11px}
  .lr.sub{color:var(--dim);font-size:11px;padding-top:3px;padding-bottom:3px;justify-content:space-between}
  .lr.sub b{color:var(--text);font-weight:500}
  .warn{color:#FF9F0A;font-size:11px;margin:4px 2px 0}
  .fld{display:flex;align-items:center;gap:8px;min-height:34px;padding:0 8px;position:relative}
  .fld+.fld::before{content:"";position:absolute;top:0;left:8px;right:0;height:.5px;background:var(--line)}
  .fld label{flex:1;font-size:13.5px}
  .fld input{width:72px;background:none;border:0;color:var(--dim);text-align:right;font:13.5px -apple-system,system-ui,Roboto,sans-serif}
  .fld input:focus{outline:none;color:var(--text)}
  .fld .seg{width:140px}
  .copy{display:block;width:100%;margin-top:7px;background:var(--tint);color:#000;border:0;border-radius:8px;
    padding:8px;font:600 13.5px/1.2 -apple-system,system-ui,Roboto,sans-serif}

  /* ---------- COUNTER ---------- */
  .sh{display:flex;align-items:center;gap:6px;margin-bottom:6px}
  .sh .ic{width:20px;height:20px}
  .sh .tot{font:700 16px/1.1 -apple-system,system-ui,Roboto,sans-serif}
  .sh .sub{font-size:10.5px;color:var(--dim)}
  .sh .grow{flex:1;min-width:0}
  .reset{background:var(--fill2);border:0;border-radius:7px;color:var(--tint);font:600 11px/1 system-ui;padding:6px 8px}
  .mixrow{margin-bottom:6px}
  .mixrow .lab{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);text-transform:uppercase;margin-bottom:3px}
  .stack{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--fill2)}
  .stack i{display:block;height:100%}
  .pcts{display:flex;justify-content:space-between;margin-top:3px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
  .pcts span{display:flex;align-items:center;gap:2px}
  .pcts .ic{width:13px;height:13px}
  .pcts .z{opacity:.35;font-weight:500}
  .send{display:flex;align-items:center;gap:7px;background:var(--card);border-radius:8px;padding:6px 7px}
  .send .ic{width:30px;height:30px}
  .send .k{font-size:10px;color:var(--dim);text-transform:uppercase}
  .send .v{font:700 15px/1.15 -apple-system,system-ui,Roboto,sans-serif}
  .send .v small{font-weight:400;font-size:12px;color:var(--dim)}
  .pick{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px}
  .pick button{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--card);border:0;border-radius:8px;
    color:var(--dim);padding:5px 1px;font:500 10px/1 -apple-system,system-ui,Roboto,sans-serif}
  .pick button .ic{width:20px;height:20px}
  .pick button.on{background:var(--card2);color:var(--text);box-shadow:inset 0 0 0 1.5px var(--tint)}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  td,th{padding:5px 6px;text-align:right;font-size:12px}
  th{font-weight:400;color:var(--dim);font-size:10.5px}
  td:first-child,th:first-child{text-align:left}
  tr+tr td{border-top:.5px solid var(--line)}
  td.z{color:var(--dim3)}
  .hi{color:var(--green);font-weight:700} .lo{color:var(--red)}
  .why{font-size:12px;color:var(--dim);margin:5px 6px 0}
</style>
</head>
<body>
<div id="app">

  <!-- ===== LAYERS ===== -->
  <section id="v-layers">
    <div class="ms">
      <img class="ic" src="icons/glyph/march.webp" alt="">
      <input id="size" type="text" inputmode="numeric" placeholder="March size" autocomplete="off">
      <span class="st" id="autoSt"><span class="dot" id="dot"></span><span id="autoTxt">auto</span></span>
      <button class="enable hide" id="enableBtn">Turn on</button>
    </div>
    <div class="ctl">
      <div class="seg" id="typeSeg"></div>
      <div class="step"><button id="tierDn">−</button><span id="tierLbl">T12</span><button id="tierUp">+</button></div>
    </div>
    <div class="card" id="layerOut"></div>
    <div class="warn hide" id="warn"></div>

    <div class="x">
      <h3>Settings</h3>
      <div class="card">
        <div class="fld"><label>Split</label><div class="seg" id="profile"></div></div>
        <div class="fld"><label>Lower tiers, % each</label><input id="lowPct" type="text" inputmode="decimal" value="1"></div>
        <div class="fld"><label>Other types, per tier</label><input id="thin" type="text" inputmode="numeric" value="1000"></div>
        <div class="fld"><label>Round to</label><div class="seg" id="round"></div></div>
      </div>
      <button class="copy" id="copyBtn">Copy layers</button>
      <p class="note">Splits come from published layering guides. Adjust from your battle reports.</p>
    </div>
  </section>

  <!-- ===== COUNTER ===== -->
  <section id="v-counter" class="hide">
    <div id="scoutOut"></div>
    <div class="x">
      <h3>Troops by tier</h3>
      <div class="card" id="tierTable"></div>
      <h3>Pick the enemy's main type yourself</h3>
      <div class="pick" id="enemyPick"></div>
      <h3>Damage multipliers · community data</h3>
      <div class="card"><table id="coefTable"></table></div>
      <p class="note">Attacker (row) vs defender (column). Reported by players, not confirmed by Evony.</p>
    </div>
  </section>
</div>

<script>
const TYPES=["ground","ranged","mounted","siege"];
const NAME={ground:"Ground",ranged:"Ranged",mounted:"Mounted",siege:"Siege"};
const ABBR={ground:"G",ranged:"R",mounted:"M",siege:"S"};
const glyph=t=>`<img class="ic" src="icons/glyph/${t}.webp" alt="">`;
const badge=t=>`<img class="ic" src="icons/badge/${t}.webp" alt="">`;
const COEF={ground:{ground:1,ranged:1.2,mounted:0.7,siege:1.1},ranged:{ground:0.8,ranged:1,mounted:1.2,siege:1.1},
  mounted:{ground:1.2,ranged:0.8,mounted:1,siege:0.9},siege:{ground:0.35,ranged:0.4,mounted:0.3,siege:0.5}};
const COUNTER={
  ground:{send:"mounted",alt:null,avoid:"ranged",why:"Mounted beats Ground and closes the distance fastest."},
  ranged:{send:"ground",alt:"siege",avoid:"mounted",why:"Ground beats Ranged. Siege also does well against Ranged from long range."},
  mounted:{send:"ranged",alt:null,avoid:"ground",why:"Ranged beats Mounted."},
  siege:{send:"mounted",alt:"ground",avoid:null,why:"Siege is weak once enemies close in. Mounted, then Ground, reach it fastest."}};
const SPLIT={guide:{ranged:[47,35,18],ground:[57,28,15],mounted:[58,29,13],siege:[57,28,15]},top:[65,23,12],even:[34,33,33]};

const store={get(k,d){try{const v=localStorage.getItem("mo_"+k);return v===null?d:v}catch(e){return d}},
             set(k,v){try{localStorage.setItem("mo_"+k,v)}catch(e){}}};
const $=id=>document.getElementById(id);
const fmt=n=>Math.round(n).toLocaleString("en-US");
const short=n=>n>=1e6?(n/1e6).toFixed(2).replace(/\.?0+$/,"")+"M":n>=1e3?(n/1e3).toFixed(n>=1e5?0:1).replace(/\.0$/,"")+"K":String(Math.round(n));
const native=window.Overlay||null;

/* ---------- view: layers / counter, compact / expanded (set by native) ---------- */
let view=store.get("view","layers"), expanded=false;
function apply(){
  $("v-layers").classList.toggle("hide",view!=="layers");
  $("v-counter").classList.toggle("hide",view!=="counter");
  document.querySelectorAll(".x").forEach(e=>e.classList.toggle("hide",!expanded));
  reportHeight();
}
window.setView=(v,exp)=>{view=v;expanded=!!exp;store.set("view",v);apply()};
function reportHeight(){
  if(!native||!native.setContentHeight) return;
  requestAnimationFrame(()=>native.setContentHeight(Math.ceil($("app").getBoundingClientRect().height)));
}
function seg(id,opts,cur,onPick){
  const el=$(id); el.innerHTML="";
  opts.forEach(([v,html])=>{
    const b=document.createElement("button"); b.innerHTML=html; b.dataset.v=v;
    if(v===cur) b.classList.add("on");
    b.onclick=()=>{el.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b)); onPick(v)};
    el.appendChild(b);
  });
}

/* ---------- keyboard: the panel only takes focus while you type ---------- */
document.addEventListener("pointerdown",e=>{
  const el=e.target.closest&&e.target.closest("input");
  if(el&&native&&native.wantKeyboard){ native.wantKeyboard(true); setTimeout(()=>el.focus(),80); }
},true);
document.addEventListener("focusout",()=>setTimeout(()=>{
  const a=document.activeElement;
  if(!a||a.tagName!=="INPUT"){ native&&native.wantKeyboard&&native.wantKeyboard(false); }
},60));
window.dropFocus=()=>{ const a=document.activeElement; if(a&&a.blur) a.blur(); };

/* ================= LAYERS ================= */
let main=store.get("main","ranged"), tier=parseInt(store.get("tier","12"),10)||12;
let prof=store.get("profile","guide"), R=store.get("round","100"), autoOn=false;
seg("typeSeg",TYPES.map(t=>[t,glyph(t)]),main,v=>{main=v;store.set("main",v);calc()});
seg("profile",[["guide","Guide"],["top","Top"],["even","Even"]],prof,v=>{prof=v;store.set("profile",v);calc()});
seg("round",[["10","10"],["100","100"],["1000","1K"]],R,v=>{R=v;store.set("round",v);calc()});
function setTier(t){tier=Math.max(1,Math.min(16,t));$("tierLbl").textContent="T"+tier;store.set("tier",tier);calc()}
$("tierDn").onclick=()=>setTier(tier-1); $("tierUp").onclick=()=>setTier(tier+1); $("tierLbl").textContent="T"+tier;
const sizeVal=()=>parseInt(String($("size").value).replace(/\D/g,""),10)||0;
function setSize(n){$("size").value=n?fmt(n):"";store.set("size",n||"")}
["lowPct","thin"].forEach(id=>{const el=$(id),v=store.get(id,null);if(v!==null)el.value=v;
  el.addEventListener("input",()=>{store.set(id,el.value);calc()})});
setSize(parseInt(store.get("size","0"),10));
$("size").addEventListener("input",()=>{setSize(sizeVal());calc()});

let lastRows=[];
function calc(){
  const S=sizeVal(), K=tier, out=$("layerOut"), warn=$("warn");
  const low=Math.max(0,parseFloat($("lowPct").value)||0)/100, thin=Math.max(0,parseInt($("thin").value,10)||0), r=parseInt(R,10);
  warn.classList.add("hide"); lastRows=[];
  if(!S||S<100){out.innerHTML=`<div class="empty">${autoOn?"Open Create Presets and your march size fills in.":"Type your march size above."}</div>`;return reportHeight()}
  const rnd=n=>Math.floor(n/r)*r;
  let split=(prof==="guide"?SPLIT.guide[main]:SPLIT[prof]).slice(0,Math.min(3,K));
  const sum=split.reduce((a,b)=>a+b,0); split=split.map(x=>x/sum);
  const lowerN=Math.max(0,K-3), lowEach=rnd(S*low), thinTotal=thin*3*K, pool=S-thinTotal-lowEach*lowerN;
  if(pool<=0){out.innerHTML=`<div class="empty">Layers exceed the march. Lower the % or other-type count.</div>`;return reportHeight()}
  if(pool<S*0.6){warn.textContent="Lower and other-type layers use over 40% of the march.";warn.classList.remove("hide")}
  const rows=[]; let used=0;
  split.forEach((p,i)=>{const n=rnd(pool*p);rows.push({t:K-i,n});used+=n}); rows[0].n+=pool-used;
  let h=rows.map(x=>`<div class="lr"><span class="t">T${x.t}</span><span class="n">${fmt(x.n)}</span><span class="p">${Math.round(x.n/S*100)}%</span></div>`).join("");
  const subs=[];
  if(lowerN&&lowEach) subs.push(`T1–${K-3} <b>${fmt(lowEach)}</b>`);
  if(thin) subs.push(`Other <b>${fmt(thin)}</b>`);
  if(subs.length) h+=`<div class="lr sub"><span>${subs[0]}</span><span>${subs[1]||""}</span></div>`;
  out.innerHTML=h;
  lastRows=rows.map(x=>`T${x.t} ${NAME[main]}: ${fmt(x.n)}`);
  if(lowerN&&lowEach) lastRows.push(`T1-T${K-3} ${NAME[main]}: ${fmt(lowEach)} each`);
  if(thin) lastRows.push(`Other types T1-T${K}: ${fmt(thin)} each`);
  reportHeight();
}
$("copyBtn").onclick=()=>{
  if(!lastRows.length) return;
  const txt=`${NAME[main]} march ${fmt(sizeVal())}\n`+lastRows.join("\n");
  if(native&&native.copy) native.copy(txt); else try{navigator.clipboard.writeText(txt)}catch(e){}
  $("copyBtn").textContent="Copied"; setTimeout(()=>$("copyBtn").textContent="Copy layers",1200);
};
function paintAuto(){
  $("dot").classList.toggle("on",autoOn);
  $("autoSt").classList.toggle("hide",!autoOn&&!!native);
  $("enableBtn").classList.toggle("hide",autoOn||!native);
}
$("enableBtn").onclick=()=>{ native&&native.requestAutoRead&&native.requestAutoRead(); };
window.onAutoState=on=>{autoOn=!!on;paintAuto();calc();renderCounter()};
window.onMarchRead=max=>{
  max=parseInt(max,10); if(!max) return;
  if(sizeVal()!==max){ setSize(max); calc(); const el=$("size"); el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
};

/* ================= COUNTER ================= */
// scout = {session, e:[{n:name, t:type, r:tier(0=unknown), c:count}]}, rebuilt natively without double counting
let scout=null, scoutAt=0; try{const s=JSON.parse(store.get("scout2","null")); if(s){scout=s.d; scoutAt=s.at}}catch(e){}
let enemyPick=store.get("enemy","");
window.onScoutData=d=>{
  if(!d||!d.e||!d.e.length){ scout=null; scoutAt=0; store.set("scout2","null"); }
  else { if(!scout||scout.session!==d.session){ enemyPick=""; store.set("enemy",""); }
    scout=d; scoutAt=Date.now(); store.set("scout2",JSON.stringify({d,at:scoutAt})); }
  renderCounter();
};
function sums(entries){ const s={ground:0,ranged:0,mounted:0,siege:0}; entries.forEach(x=>s[x.t]+=x.c); return s; }
function mainOf(s){ let b=null; TYPES.forEach(t=>{ if(s[t]>0&&(!b||s[t]>s[b])) b=t }); return b; }
function ago(ts){ const m=Math.round((Date.now()-ts)/60000); return m<1?"just now":m<60?m+" min ago":Math.round(m/60)+" h ago"; }
function mixRow(label,right,s){
  const tot=TYPES.reduce((a,t)=>a+s[t],0)||1;
  return `<div class="mixrow"><div class="lab"><span>${label}</span><span>${right}</span></div>
    <div class="stack">${TYPES.map(t=>`<i class="b-${t}" style="width:${s[t]/tot*100}%"></i>`).join("")}</div>
    <div class="pcts">${TYPES.map(t=>{const p=Math.round(s[t]/tot*100);return `<span class="c-${t}${p?"":" z"}">${glyph(t)}${p}%</span>`}).join("")}</div></div>`;
}
function renderCounter(){
  const out=$("scoutOut"), entries=scout?scout.e:[];
  let enemy=enemyPick||null, basis="";
  let h="";
  if(entries.length){
    const all=sums(entries), tot=TYPES.reduce((a,t)=>a+all[t],0);
    const top=Math.max(0,...entries.map(x=>x.r||0));
    const topS=top?sums(entries.filter(x=>x.r===top)):null;
    const live=Date.now()-scoutAt<4000;
    h+=`<div class="sh">${glyph("scout")}<div class="grow"><div class="tot">${short(tot)} troops</div>
      <div class="sub">${live?"Reading… keep scrolling":"Scouted "+ago(scoutAt)} · ${entries.length} troop line${entries.length>1?"s":""}</div></div>
      <button class="reset" id="resetBtn">Reset</button></div>`;
    if(topS) h+=mixRow(`Top tier · T${top}`,short(TYPES.reduce((a,t)=>a+topS[t],0)),topS);
    h+=mixRow("All troops",short(tot),all);
    if(!enemy){ enemy=mainOf(topS||all); basis=topS?`T${top}`:"all"; }
  } else {
    h+=`<div class="sh">${glyph("scout")}<div class="grow"><div class="tot" style="font-size:14px">No scout yet</div>
      <div class="sub">${autoOn?"Open a scout report and scroll through it.":"Turn on auto-read to scan scout reports."}</div></div></div>`;
  }
  if(enemyPick) basis="picked";
  if(enemy){ const c=COUNTER[enemy];
    h+=`<div class="send">${badge(c.send)}<div><div class="k">vs ${NAME[enemy]} · ${basis} · send</div>
      <div class="v c-${c.send}">${NAME[c.send]}${c.alt?` <small>or ${NAME[c.alt]}</small>`:""}</div></div></div>`;
    if(expanded) h+=`<div class="why">${c.why}${c.avoid?` Avoid ${NAME[c.avoid]}.`:""}</div>`;
  } else if(!entries.length){
    h+=`<div class="pick" id="quickPick"></div>`;
  }
  out.innerHTML=h;
  const rb=$("resetBtn"); if(rb) rb.onclick=()=>{ if(native&&native.resetScout) native.resetScout(); else window.onScoutData(null); };
  const qp=$("quickPick"); if(qp) buildPick(qp);

  // expanded: troops by tier
  if(entries.length){
    const tiers=[...new Set(entries.map(x=>x.r||0))].sort((a,b)=>b-a);
    let t=`<table><tr><th>Tier</th>${TYPES.map(x=>`<th class="c-${x}">${ABBR[x]}</th>`).join("")}</tr>`;
    tiers.forEach(r=>{ const s=sums(entries.filter(x=>(x.r||0)===r));
      t+=`<tr><td>${r?"T"+r:"?"}</td>${TYPES.map(x=>`<td class="${s[x]?"":"z"}">${s[x]?short(s[x]):"–"}</td>`).join("")}</tr>`; });
    $("tierTable").innerHTML=t+"</table>";
  } else $("tierTable").innerHTML=`<div class="empty">Nothing scanned yet.</div>`;

  let c=`<tr><th>Atk \\ Def</th>${TYPES.map(t=>`<th>${ABBR[t]}</th>`).join("")}</tr>`;
  TYPES.forEach(a=>{c+=`<tr><td class="c-${a}">${NAME[a]}</td>`+TYPES.map(d=>{const v=COEF[a][d];
    const cls=d===enemy&&v>=1.1?"hi":d===enemy&&v<1?"lo":"";return `<td class="${cls}">${v}</td>`}).join("")+"</tr>"});
  $("coefTable").innerHTML=c;
  buildPick($("enemyPick"));
  reportHeight();
}
function buildPick(el){
  el.innerHTML="";
  TYPES.forEach(t=>{const b=document.createElement("button");b.innerHTML=glyph(t)+NAME[t];
    if(t===enemyPick)b.classList.add("on");
    b.onclick=()=>{enemyPick=enemyPick===t?"":t;store.set("enemy",enemyPick);renderCounter()};
    el.appendChild(b)});
}
setInterval(()=>{ if(view==="counter"&&scout) renderCounter(); },5000);

if(native&&native.isAutoRead){ autoOn=native.isAutoRead(); }
paintAuto(); calc(); renderCounter(); apply();
window.addEventListener("load",reportHeight);
document.querySelectorAll("img").forEach(i=>i.addEventListener("load",reportHeight));
</script>
</body>
</html>
